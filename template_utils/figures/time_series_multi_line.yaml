name: time_series_multi_line
version: 1
extends: time_series

params:
  x_var: "ObsMonitor::MetaData::validTime"
  markersize: 5
  series: []

layer_template:
  type: LinePlot
  drop_nan: false
  x: { variable: "{x_var}" }
  y: { variable: "{series_y}", slices: "{series_slices}" }
  markersize: "{markersize}"
  label: "{series_label}"
  color: "{series_color}"

plots:
  - add_xlabel: "Datetime"
    add_ylabel: "{y_label}"
    add_grid:
    add_legend: { loc: "{legend_loc}" }
    layers: []
