ob_types:

  prepbufr_adpsfc:
    datasets:
      - filenames_template:
          template: "{{ runtime_dir }}/sfc_ps_%Y%m%d%H_output_atmos_gsi.nc"
        groups:
          - name: "byDomains/ombg/stationPressure"
            variables: [mean, count, RMS]
          - name: "byDomains/oman/stationPressure"
            variables: [mean, count, RMS]
          - name: "griddedBins/ombg/stationPressure"
            variables: [mean, count, RMS]
        variables: [validTime]

      # GridDef dataset (LatLon grid centers)
      - name: GridDef
        type: LatLon
        filename: "{{ HOMEobsmon }}/parm/grid_def_1deg_centers.nc"
        group: state
        variables: [latitude, longitude]

    transforms:
      - transform: reduce
        source: "ObsMonitor::griddedBins_ombg_stationPressure::mean"
        new name: "ObsMonitor::griddedBins_ombg_stationPressure::mean_cycleAvg"
        op: "mean"
        dims: ["analysisCycle"]
        skipna: true
        squeeze_binsZ: false
        mask_fill: true

    figures:
      - use: map_gridded_single
        params:
          title: "ADPSFC stationPressure O-F — Cycle Avg (gridded)"
          output: "[[runtime_dir]]/plots/adpsfc/stationPressure/adpsfc_mean_stationPressure_global_binned_avg_[[start_YMDH]]_[[end_YMDH]].png"
          colorbar_label: "hPa"
          projection: plcarr
          domain: global
          x_var: "GridDef::state::longitude"
          y_var: "GridDef::state::latitude"
          data_var: "ObsMonitor::griddedBins_ombg_stationPressure::mean_cycleAvg"
          data_slices: "[0,:,:]"
          cmap: "coolwarm"
