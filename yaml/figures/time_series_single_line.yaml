name: time_series_single_line
version: 1
extends: time_series

params:
  legend_loc: upper left
  x_var: "ObsMonitor::MetaData::validTime"
  y_var: ""
  y_slices: ""
  variable: ""
  y_label: "{variable} (Mean)"
  line_label: "{variable}"
  color: "black"
  markersize: 5

figure:
  layout: [1,1]
  title: "{title}"
  output name: "{output}"

plots:
  - add_xlabel: "Datetime"
    add_ylabel: "{y_label}"
    add_grid:
    add_legend: { loc: "{legend_loc}" }
    layers:
      - type: LinePlot
        drop_nan: false
        x: { variable: "{x_var}" }
        y: { variable: "{y_var}", slices: "{y_slices}" }
        markersize: "{markersize}"
        label: "{line_label}"
        color: "{color}"