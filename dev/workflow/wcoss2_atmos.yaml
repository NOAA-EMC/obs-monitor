pslot: "obsmon_gdas_atmos"
component: "atmos"   # list or comma-separated string both ok
start_date: "YYYYMMDDHHMM"
end_date: "YYYYMMDDHHMM"
interval_hours: 6
cycles: 4

paths:
  obsmondir: "~/obs-monitor"
  expdir: "~/obsmon_exp"
  rundir: "~/obsmon_runtime"
  comroot: "~/obsmon_save"
  dataroot: "~/obsmon_dataroot"

run: "gdas"

hpc:
  account: "GFS-DEV"
  queue: "dev"
  push_queue: "dev_transfer"
  scheduler: "pbspro"

resources:
  walltime: "00:15:00"
  push_walltime: "00:10:00"
  task_nodes: "1:ppn=1:tpp=1"
  push_nodes: "1:ppn=1"
  task_mem: "4GB"
  push_mem: "1GB"
  native: "-l select=1:ncpus=1:mem=4GB"
  push_native: "-l select=1:ncpus=1:mem=1GB"
  server: "emcrzdm"
  server_path: "~/obsmon/"
  server_user: "$USER"

flags:
  copy_data: false
  keep_data: True
  create_stubs: True
  push_files: True
