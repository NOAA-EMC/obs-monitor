# Conventional obs spaces.
#
# Names are the <obs_space> in diag_<obs_space>_YYYYMMDDHH.nc, component 
# is the COM folder holding the tarball (analysis/atmos/...ioda_hofx.tar.gz),
# not the obs category.
#
# variables: omitted = every simulated variable in the file (the ombg group).
# stationPressure matches what the stat-file pipeline monitored.

obs_spaces:

  prepbufr_adpsfc:
    component: atmos
    variables: [stationPressure]

  prepbufr_adpupa:
    component: atmos
    variables: [stationPressure]

  prepbufr_sfcshp:
    component: atmos
    variables: [stationPressure]
