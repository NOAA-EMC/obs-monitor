ob_types:

  icec_generic_passive:
    datasets:
      - filenames_template:
          template: "{{ runtime_dir }}/icec_generic_passive_%Y%m%d%H_output_marine.nc"
        groups:
          - name: "byDomains/ombg/seaIceFraction"
            variables: [assimilated_mean, assimilated_count, assimilated_RMS,
                        monitored_mean, monitored_count, monitored_RMS,
                        rejected_mean, rejected_count, rejected_RMS]
          - name: "byDomains/oman/seaIceFraction"
