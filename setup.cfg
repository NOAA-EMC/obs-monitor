[metadata]
name = obs_monitor
version = 0.2.0
description = Observation Monitoring tools (templating + driver)
license = LGPL-2.1
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/NOAA-EMC/obs-monitor
 
[options]
packages = find_namespace:
package_dir =
    = src
python_requires = >=3.10
# PyPI-installable runtime deps. emcpy, wxflow and cartopy are provided by
# spack-stack modules on HPC (see modulefiles/) and by requirements.txt in CI.
install_requires =
    netCDF4>=1.6
    numpy>=1.24
    PyYAML>=6.0
    xarray>=2022.6
    matplotlib>=3.7
 
# Include package data (templates, YAML, etc.)
include_package_data = True
 
[options.extras_require]
test =
    pytest
    pytest-cov
    pycodestyle>=2.9.1
workflow =
    jinja2>=3.0
 
[options.packages.find]
where = src
exclude =
    tests
    docs
 
[options.entry_points]
console_scripts =
    obs-monitor-driver = obs_monitor.driver.driver:main
 
[options.package_data]
# Ship everything under obs_monitor/data/** (adjust as needed)
obs_monitor =
    data/**
