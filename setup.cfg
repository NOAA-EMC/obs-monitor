[metadata]
name = obs-monitor
version = 0.1.0
description = Observation Monitoring tools (templating + driver)
license = LGPL-2.1
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/NOAA-EMC/obs-monitor

[options]
packages = find_namespace:
package_dir =
    = src
python_requires = >=3.10
install_requires =
    # jinja2>=3.1
    # pyyaml>=6
    # pandas
    # numpy
    # xarray

# Include package data (templates, YAML, etc.)
include_package_data = True

[options.packages.find]
where = src
exclude =
    tests
    docs

# If you decide to expose CLIs later, uncomment and point to callables
#[options.entry_points]
#console_scripts =
#    obs-monitor-driver = obs_monitor.driver.driver:main

[options.package_data]
# Ship everything under obs_monitor/data/** (adjust as needed)
obs_monitor =
    data/**
