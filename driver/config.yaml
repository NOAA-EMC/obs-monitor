jobs:
  - monitor_type: 'radiance'
    component: 'chem'
    satellite: 'n20'
    sensor: 'viirs'
    template_path: '${HOMEobsmon}/templates/ioda_stats_viirs_n20.yaml.j2'
    filename_template: '%Y%m%d.%H%M%S.ioda_hofx_stats.viirs_n20.nc'

  - monitor_type: 'radiance'
    component: 'chem'
    satellite: 'npp'
    sensor: 'viirs'
    template_path: '${HOMEobsmon}/templates/ioda_stats_viirs_npp.yaml.j2'
    filename_template: '%Y%m%d.%H%M%S.ioda_hofx_stats.viirs_npp.nc'

  - monitor_type: 'conventional'
    component: 'snow'
    variable: 'snocvr'
    template_path: '${HOMEobsmon}/templates/ioda_stats_snocvr.yaml.j2'
    filename_template: '%Y%m%d.%H%M%S.ioda_hofx_stats.snocvr.nc'

  - monitor_type: 'conventional'
    component: 'atmos'
    variable: 'prepbufr_adpsfc'
    template_path: '${HOMEobsmon}/templates/ioda_stats_prepbufr_adpsfc.yaml.j2'
    filename_template: '%Y%m%d.%H%M%S.ioda_hofx_stats.prepbufr_adpscf.nc'
