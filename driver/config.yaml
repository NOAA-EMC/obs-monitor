jobs:
  - monitor_type: 'radiance'
    component: 'aod'
    satellite: 'n20'
    sensor: 'viirs'
    template_path: '${HOMEobsmon}/templates/ioda_stats_viirs_n20.yaml.j2'

  - monitor_type: 'radiance'
    component: 'aod'
    satellite: 'npp'
    sensor: 'viirs'
    template_path: '${HOMEobsmon}/templates/ioda_stats_viirs_npp.yaml.j2'

  - monitor_type: 'conventional'
    component: 'snow'
    variable: 'snocvr'
    template_path: '${HOMEobsmon}/templates/ioda_stats_snocvr.yaml.j2'
