    starting field: ges::ges::bias3
    where:
      - ges::ges::level == 1
    for:
      variable: [none]

  - transform: accept where
    new name: anl::anl::bias3_allev
    starting field: anl::anl::bias3
    where:
      - anl::anl::level == 1
    for:
      variable: [none]

  - transform: accept where
    new name: ges::ges::bias2_allev
    starting field: ges::ges::bias2
    where:
