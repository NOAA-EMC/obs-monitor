###############################################################################
#
# Time series plots for ConMon gfs
#
# Generate separate 30 day time series plots for:
#   - global 
#       num assimilated         (count1.1, count1.2, where .1 = ges, .2 = anl)
#       num rejected by vqc     (count_vqc1.1, count_vqc1.2) 
#       num rejected by gc      (count2.1, count2.2)
#       num monitored           (count3.1, count3.2)
#      
###############################################################################

diagnostics:

# Data read
# ---------
datasets:
  - name: ges
    obstype: {{OBSTYPE}} 
    type: MonDataSpace
    control_file:
      - {{DATA}}/ges_{{OBSTYPE}}_stas.ctl
    filenames:
      {% for i in range(0, 720, 6) %}
      {% set offset_hr = i | string %}
      {% set offset_str = "-" + offset_hr + "H" %}
      {% set offset_td = offset_str | to_timedelta %}
      {% set PDATEnew = PDATE | add_to_datetime(offset_td) %}
      - {{DATA}}/ges_{{OBSTYPE}}_stas.{{ PDATEnew | to_YMDH }}
      {% endfor %}

    regions: 1

    datatypes: {{DATATYPES}}

    groups:
      - name: ges

  - name: anl
    obstype: {{OBSTYPE}} 
    type: MonDataSpace
    control_file:
      - {{DATA}}/anl_{{OBSTYPE}}_stas.ctl
    filenames:
      {% for i in range(0, 720, 6) %}
      {% set offset_hr = i | string %}
      {% set offset_str = "-" + offset_hr + "H" %}
      {% set offset_td = offset_str | to_timedelta %}
      {% set PDATEnew = PDATE | add_to_datetime(offset_td) %}
      - {{DATA}}/anl_{{OBSTYPE}}_stas.{{ PDATEnew | to_YMDH }}
      {% endfor %}

    regions: 1

    datatypes: {{DATATYPES}}
    
    groups:
      - name: anl

transforms:
  - transform: accept where
    new name: ges::ges::count1_allev
    starting field: ges::ges::count1
    where:
      - ges::ges::level == 1
    for:
      variable: [none]

  - transform: accept where
    new name: anl::anl::count1_allev
    starting field: anl::anl::count1
    where:
      - anl::anl::level == 1
    for:
      variable: [none]

  - transform: accept where
    new name: ges::ges::count_vqc1_allev
    starting field: ges::ges::count_vqc1
    where:
      - ges::ges::level == 1
    for:
      variable: [none]

  - transform: accept where
    new name: anl::anl::count_vqc1_allev
    starting field: anl::anl::count_vqc1
    where:
      - anl::anl::level == 1
    for:
      variable: [none]

  - transform: accept where
    new name: ges::ges::count2_allev
    starting field: ges::ges::count2
    where:
      - ges::ges::level == 1
    for:
      variable: [none]

  - transform: accept where
    new name: anl::anl::count2_allev
    starting field: anl::anl::count2
    where:
      - anl::anl::level == 1
    for:
      variable: [none]

  - transform: accept where
    new name: ges::ges::count3_allev
    starting field: ges::ges::count3
    where:
      - ges::ges::level == 1
    for:
      variable: [none]

  - transform: accept where
    new name: anl::anl::count3_allev
    starting field: anl::anl::count3
    where:
      - anl::anl::level == 1
    for:
      variable: [none]

  - transform: accept where
    new name: ges::ges::bias1_allev
    starting field: ges::ges::bias1
    where:
      - ges::ges::level == 1
    for:
      variable: [none]

  - transform: accept where
    new name: anl::anl::bias1_allev
    starting field: anl::anl::bias1
    where:
      - anl::anl::level == 1
    for:
      variable: [none]

  - transform: accept where
    new name: ges::ges::rms1_allev
    starting field: ges::ges::rms1
    where:
      - ges::ges::level == 1
    for:
      variable: [none]

  - transform: accept where
    new name: anl::anl::rms1_allev
    starting field: anl::anl::rms1
    where:
      - anl::anl::level == 1
    for:
