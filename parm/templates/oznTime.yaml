#
# Time series plots for OznMon gfs
#
# Generate separate 30 day time/series plots for:
#   - number of obs 
#   - penalty
#   - omgnbc
#   - bias correction
#   - omgbc

diagnostics:

# Data read
# ---------
datasets:
  - name: time
    satellite: {{SAT}}
    sensor: {{SENSOR}}
    type: MonDataSpace
    control_file:
      - {{DATA}}/{{SENSOR}}_{{SAT}}.{{COMPONENT}}.ctl
    filenames:
      {% for i in range(0, 726, 6) %}
      {% set offset_hr = i | string %}
      {% set offset_str = "-" + offset_hr + "H" %}
      {% set offset_td = offset_str | to_timedelta %}
      {% set PDATEnew = PDATE | add_to_datetime(offset_td) %}
      - {{DATA}}/{{SENSOR}}_{{SAT}}.{{COMPONENT}}.{{ PDATEnew | to_YMDH }}.ieee_d
      {% endfor %}

    levels: {{LEVELS}}
    regions: &regions 1
    groups:
      - name: GsiIeee
        variables: &variables ['cnt', 'cpen', 'sdvomg', 'avgomg']

graphics:

  plotting_backend: Emcpy
  figure_list:

    # Obs count plots
    # ---------------
    - batch figure:
        levels: {{LEVELS}}
        variables: ['cnt', 'cpen']
        sensor: {{SENSOR}}

      figure:
        layout: [1,1]
        figure size: [20,18]
        tight layout:
        title: "${variable}, {{SENSOR}}_{{SAT}} level ${level}  \n Valid: {{ PDATE | to_YMDH }}"
        output name: line_plots/ozn/time/{{SENSOR}}_{{SAT}}.${level}.${variable}.png
        plot logo:
          which: 'noaa/nws'
          loc: 'upper right'

      plots:
        - add_xlabel: 'Cycle'
          add_ylabel: '${variable}'
          layers:
          - type: LinePlot
            x:
              variable: time::GsiIeee::cycle
            y:
              variable: time::GsiIeee::${variable}
            color: 'blue'
            level: ${level}
          add_grid:
            axis: 'both'
            linestyle: 'dotted'
            linewidth: 0.25
            color: 'black'


    # All defined variables
    # ---------------------
    - batch figure:
        variables: ['sdvomg']
        levels: {{LEVELS}}

      figure:
        layout: [2,1]
        figure size: [20,18]
        tight layout:
        title: "obs-{{COMPONENT}} {{SENSOR}}_{{SAT}} level ${level}  \n Valid: {{ PDATE | to_YMDH }}"
        output name: line_plots/ozn/time/{{SENSOR}}_{{SAT}}.${level}.omg.png
        plot logo:
          which: 'noaa/nws'
          loc: 'upper right'

      plots:
        - add_xlabel: 'Cycle'
          add_ylabel: "Standard Deviation"
          layers:
          - type: LinePlot
            x:
              variable: time::GsiIeee::cycle
            y:
              variable: time::GsiIeee::${variable}
            color: 'red'
            level: ${level}
          add_grid:
            axis: 'both'
            linestyle: 'dotted'
            linewidth: 0.25
            color: 'black'

        - add_xlabel: 'Cycle'
          add_ylabel: "Average"
          layers:
          - type: LinePlot
            x:
              variable: time::GsiIeee::cycle
            y:
              variable: time::GsiIeee::avgomg
            color: 'blue'
            level: ${level}
          add_grid:
            axis: 'both'
            linestyle: 'dotted'
            linewidth: 0.25
            color: 'black'
