name: Unit Tests
on: [push, pull_request]

# Plain Python + pip, no conda: the Ubuntu 26.04 runner images
# (ubuntu-latest from Nov 2026) no longer ship Miniconda. Every dependency,
# cartopy and EMCPy included, installs from requirements.txt.
# Python 3.11 matches stack-python on ursa.

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Run unit tests

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: obs-monitor

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: obs-monitor/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r obs-monitor/requirements.txt

    - name: Install obs-monitor
      run: python -m pip install -e obs-monitor

    - name: Run unit tests
      env:
        MPLBACKEND: Agg  # non-interactive matplotlib backend; required in CI
      run: |
        cd obs-monitor
        python -m pytest src/tests/ -v --tb=short \
          --cov=obs_monitor \
          --cov-report=term-missing
