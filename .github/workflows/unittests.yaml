name: Unit Tests
on: [push, pull_request]

jobs:
  ctests:
    runs-on: ubuntu-latest
    name: Run Unit Tests with ctest

    steps:

    # Update conda
    - name: Update conda
      run: conda update -n base -c defaults conda

    # Install pip
    - name: Install pip
      run: conda install pip

    - name: Checkout
      uses: actions/checkout@v2
      with:
        path: obs-monitor

    # Install dependencies from obs-monitor
    - name: Install obs-monitor dependencies
      run: $CONDA/bin/pip3 install -r obs-monitor/requirements.txt --user

    - name: Checkout wxflow
      uses: actions/checkout@v3
      with:
        repository: NOAA-EMC/wxflow
        ref: develop
        path: wxflow

    - name: Install wxflow
      run: |
        cd wxflow
        $CONDA/bin/pip3 install .

    # Install cartopy (required by EMCPy)
    - name: Install cartopy
      run: conda install -c conda-forge cartopy

    # Install EMCPy (replaces EVA)
    - name: Clone EMCPy
      uses: actions/checkout@v2
      with:
        repository: NOAA-EMC/emcpy
        ref: develop
        path: emcpy

    - name: Install EMCPy
      run: |
        cd emcpy
        $CONDA/bin/pip3 install .

    # Install pytest
    - name: Install pytest
      run: $CONDA/bin/pip3 install pytest pytest-cov

    # Install obs-monitor itself so plotting subpackage is importable
    - name: Install obs-monitor
      run: |
        cd obs-monitor
        $CONDA/bin/pip3 install -e .

    # Run unit tests
    - name: Run unit tests
      env:
        MPLBACKEND: Agg  # non-interactive matplotlib backend; required in CI
      run: |
        cd obs-monitor
        $CONDA/bin/pytest src/tests/plotting/ src/tests/driver/ -v --tb=short \
          --cov=obs_monitor.plotting \
          --cov=obs_monitor.driver \
          --cov-report=term-missing
